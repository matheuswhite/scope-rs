[package]
name = "scope-monitor"
description = "A multi-platform serial monitor with user-extensible features"
authors = ["Matheus T. dos Santos <matheuswhite1@protonmail.com>"]
version = "0.6.1"
edition = "2024"
rust-version = "1.92.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/matheuswhite/scope-rs"
homepage = "https://github.com/matheuswhite/scope-rs"
keywords = ["serial", "monitor", "windows", "linux", "plugin"]
exclude = [
  "/.git/",
  "/.github/",
  "/.idea/",
  "/.vscode/",
  "/.zed/",
  "/imgs/",
  "/videos/",
  "/.gitignore",
  "/CONTRIBUTING.md",
]

[package.metadata.wix]
upgrade-guid = "FD43BE2D-DFB0-4ED7-9DFB-D52ABAEA75B2"
path-guid = "0597BF5A-C64D-42FA-A699-364ED3C70C6F"
license = false
eula = false

[badges]
maintenance = { status = "actively-developed" }

[[bin]]
name = "scope"
path = "src/main.rs"

[dependencies]
serialport = { version = "4.4.0", features = ["usbportinfo-interface"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["default", "event-stream"] }
futures = "0.3.30"
chrono = "0.4.23"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
rand = "0.8.6"
# 4.5.20 is the floor `clap_complete` requires. Held to 4.5.x (`~`) because
# `clap_complete/unstable-dynamic` turns on `clap/unstable-ext`, which is exempt
# from clap's semver guarantees — see `clap_complete` below.
clap = { version = "~4.5.20", features = ["derive"] }
mlua = { version = "0.9.6", features = ["lua54", "vendored", "async", "send"] }
anyhow = "1.0.79"
dirs = "5"
tokio = { version = "1.43.1", features = ["full"] }
regex = "1.10.5"
lipsum = "0.9.1"
arboard = "3.6.1"
probe-rs = "0.31.0"
nucleo = "0.5.0"
# Shell completion (issues #231, #236). `scope completions <SHELL>` prints the
# *dynamic* registration script, so Tab asks the binary itself and can offer
# live serial ports and probe-rs targets (`src/completion.rs`). That API lives
# behind `unstable-dynamic`, which is excluded from clap's semver guarantees, so
# the version is pinned exactly: a `cargo install` without `--locked` must not
# pick up a release that changed it. Bump deliberately, then rerun
# `cargo test --test completions`.
clap_complete = { version = "=4.6.8", features = ["unstable-dynamic"] }
# Reads the `_SEGGER_RTT` symbol out of an ELF for `scope rtt --elf` (issue
# #248), so the control block is found without scanning. Read-only ELF support
# is all we need, and it is already in the tree as a probe-rs dependency.
object = { version = "0.38", default-features = false, features = [
    "read_core",
    "elf",
    "std",
] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.4.3"

# Embeds the scope icon into scope.exe (see build.rs); Windows-only.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Used by `tests/completions.rs`, which runs on every platform.
[dev-dependencies]
tempfile = "3"
# `write` is dev-only: the `rtt_elf` tests build the ELF fixtures they parse,
# so no binary blob has to be checked in.
object = { version = "0.38", features = ["write"] }

# Used only by the end-to-end TUI integration tests in `tests/tui_e2e.rs`.
[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.8"
vt100 = "0.15"
nix = { version = "0.29", features = ["term"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
