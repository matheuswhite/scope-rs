[package]
name = "scope-monitor"
description = "A multi-platform serial monitor with user-extensible features"
authors = ["Matheus T. dos Santos <matheuswhite1@protonmail.com>"]
version = "0.6.0"
edition = "2024"
rust-version = "1.92.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/matheuswhite/scope-rs"
homepage = "https://github.com/matheuswhite/scope-rs"
keywords = ["serial", "monitor", "windows", "linux", "plugin"]
exclude = [
  "/.git/",
  "/.github/",
  "/.idea/",
  "/.vscode/",
  "/.zed/",
  "/imgs/",
  "/videos/",
  "/.gitignore",
  "/CONTRIBUTING.md",
]

[package.metadata.wix]
upgrade-guid = "FD43BE2D-DFB0-4ED7-9DFB-D52ABAEA75B2"
path-guid = "0597BF5A-C64D-42FA-A699-364ED3C70C6F"
license = false
eula = false

[badges]
maintenance = { status = "actively-developed" }

[[bin]]
name = "scope"
path = "src/main.rs"

[dependencies]
serialport = { version = "4.4.0", features = ["usbportinfo-interface"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["default", "event-stream"] }
futures = "0.3.30"
chrono = "0.4.23"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
rand = "0.8.6"
# 4.5.20 is the floor `clap_complete` requires.
clap = { version = "4.5.20", features = ["derive"] }
mlua = { version = "0.9.6", features = ["lua54", "vendored", "async", "send"] }
anyhow = "1.0.79"
dirs = "5"
tokio = { version = "1.43.1", features = ["full"] }
regex = "1.10.5"
lipsum = "0.9.1"
arboard = "3.6.1"
probe-rs = "0.31.0"
nucleo = "0.5.0"
# Generates the native shell completion scripts `scope completions <SHELL>`
# prints (issue #231). Static (ahead-of-time) generation only — the dynamic
# completion API is behind a semver-exempt feature flag.
clap_complete = "4.6.8"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.4.3"

# Embeds the scope icon into scope.exe (see build.rs); Windows-only.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Used by `tests/completions.rs`, which runs on every platform.
[dev-dependencies]
tempfile = "3"

# Used only by the end-to-end TUI integration tests in `tests/tui_e2e.rs`.
[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.8"
vt100 = "0.15"
nix = { version = "0.29", features = ["term"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
