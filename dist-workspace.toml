[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# We hand-edit wix/main.wxs to add per-command Start-Menu shortcuts with their
# own icons (issue #230), so tell dist to stop regenerating/validating it.
allow-dirty = ["msi"]

# The `serialport` crate links against libudev on Linux; install it on the
# Linux build runner (mirrors the old release workflow's apt step).
[dist.dependencies.apt]
libudev-dev = '*'
